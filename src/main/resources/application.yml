spring:
  application.name: finance
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finance}
    username: ${DB_USER:finance}
    password: ${DB_PASSWORD:finance}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway.enabled: true
  servlet.multipart:
    max-file-size: 20MB
    max-request-size: 20MB
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:https://ollama.com}
      chat:
        options:
          model: ${OLLAMA_MODEL:gpt-oss:120b}

server.port: ${PORT:8080}

finance:
  base-currency: PLN
  # Window in days for pairing transfer legs between your own accounts.
  transfer-match-window-days: 4
  # Below this threshold a transaction goes to the review queue instead of being saved.
  llm-confidence-threshold: 0.80
  llm:
    api-key: ${OLLAMA_API_KEY:}
  pekao:
    # Column names from Pekao's "Lista operacji" CSV export.
    charset: UTF-8
    delimiter: ";"
    date-format: dd.MM.yyyy
    columns:
      txn-date: "Data waluty"
      booked-date: "Data księgowania"
      amount: "Kwota operacji"
      currency: "Waluta"
      counterparty: "Nadawca / Odbiorca"
      counterparty-iban-source: "Rachunek źródłowy"
      counterparty-iban-dest: "Rachunek docelowy"
      description: "Tytułem"
